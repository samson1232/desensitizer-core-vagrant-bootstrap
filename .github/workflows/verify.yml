name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline controls (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install integration extras
        run: python -m pip install -r requirements.txt
      - name: Run every offline control (no skips allowed)
        run: python verify.py --strict
